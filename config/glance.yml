theme:
  background-color: 240 8 9
  primary-color: 150 40 55
  positive-color: 150 60 50
  negative-color: 0 70 60
  contrast-multiplier: 1.1

branding:
  app-name: fluxt // control

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: fluxlab
                hide-swap: true
                hide-mountpoints-by-default: true
                mountpoints:
                  "/mnt/ssd":
                    name: SSD
                    hide: false
                  "/mnt/data":
                    name: HDD
                    hide: false

          - type: custom-api
            title: Uptime Kuma
            title-url: ${UPTIME_KUMA_URL}
            url: ${UPTIME_KUMA_URL}/api/status-page/${UPTIME_KUMA_STATUS_SLUG}
            subrequests:
              heartbeats:
                url: ${UPTIME_KUMA_URL}/api/status-page/heartbeat/${UPTIME_KUMA_STATUS_SLUG}
            cache: 10m
            template: |
              {{ $hb := .Subrequest "heartbeats" }}

              {{ if not (.JSON.Exists "publicGroupList") }}
              <p class="color-negative">Error reading response</p>
              {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
              <p>No monitors found</p>
              {{ else }}

              <ul class="dynamic-columns list-gap-8">
                {{ range .JSON.Array "publicGroupList" }}
                {{ range .Array "monitorList" }}
                {{ $id := .String "id" }}
                {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
                <div class="flex items-center gap-12">
                  <a class="size-title-dynamic color-highlight text-truncate block grow" href="${UPTIME_KUMA_URL}/dashboard/{{ $id }}"
                    target="_blank" rel="noreferrer">
                    {{ .String "name" }} </a>

                  {{ if gt (len $hbArray) 0 }}
                    {{ $latest := index $hbArray (sub (len $hbArray) 1) }}
                    {{ if eq ($latest.Int "status") 1 }}
                    <div>{{ $latest.Int "ping" }}ms</div>
                    <div class="monitor-site-status-icon-compact" title="OK">
                      <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ else }}
                    <div><span class="color-negative">DOWN</span></div>
                    <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists "msg" }}{{ $latest.String "msg" }}{{ else }}Error{{ end }}">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                          d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                          clip-rule="evenodd"></path>
                      </svg>
                    </div>
                    {{ end }}
                  {{ else }}
                    <div><span class="color-negative">No data</span></div>
                    <div class="monitor-site-status-icon-compact" title="No data available">
                      <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-2a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm-.75-8a.75.75 0 0 1 1.5 0v3a.75.75 0 0 1-1.5 0V8zm.75 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                      </svg>
                    </div>
                  {{ end }}
                </div>
                {{ end }}
                {{ end }}
              </ul>
              {{ end }}

          - type: docker-containers
            title: Services
            hide-by-default: false
            running-only: false

          - type: dns-stats
            service: adguard
            url: http://192.168.1.100/
            username: james
            password: ${ADGUARD_PASSWORD}

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            new-tab: true
            autofocus: true

          - type: rss
            title: Weather Warnings
            style: detailed-list
            limit: 5
            cache: 30m
            feeds:
              - url: https://weather.metoffice.gov.uk/public/data/PWSCache/WarningsRSS/Region/sw
                title: Met Office SW England

          - type: rss
            title: Devon News
            style: horizontal-cards
            limit: 10
            collapse-after: 6
            feeds:
              - url: https://feeds.bbci.co.uk/news/england/devon/rss.xml
                title: BBC Devon

              - url: https://www.devonlive.com/news/?service=rss
                title: Devon Live

          - type: rss
            title: Tech News
            style: horizontal-cards
            limit: 10
            collapse-after: 6
            feeds:
              - url: https://techradar.com/rss
                title: TechRadar
              - url: https://feeds.bbci.co.uk/news/technology/rss.xml
                title: BBC Technology
              - url: https://www.theregister.com/headlines.atom
                title: The Register

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Development
                color: 210 60 55
                links:
                  - title: My repos
                    url: https://github.com/fluxtt?tab=repositories
                    icon: si:github

                  - title: regex101
                    url: https://regex101.com
                    icon: mdi:regex

              - title: Productivity
                color: 40 70 55
                links:
                  - title: Todoist
                    url: https://todoist.com
                    icon: si:todoist

                  - title: Claude
                    url: https://claude.ai
                    icon: si:claude

              - title: Homelab
                color: 150 40 55
                links:
                  - title: UniFi Network
                    url: https://unifi.ui.com/consoles/2526a384-d949-4952-94c6-8d14c4fc41fd/network/default/dashboard
                    icon: si:ubiquiti
