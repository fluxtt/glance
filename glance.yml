theme:
  background-color: 240 8 9
  primary-color: 150 40 55
  positive-color: 150 60 50
  negative-color: 0 70 60
  contrast-multiplier: 1.1

branding:
  app-name: fluxt // control

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: UTC
                label: UTC

          - type: weather
            location: Exeter, United Kingdom
            units: metric
            hour-format: 24h

          - type: dns-stats
            service: adguard
            url: http://192.168.1.100/
            username: james
            password: ${ADGUARD_PASSWORD}

      - size: full
        widgets:
          - type: search
            search-engine: duckduckgo
            new-tab: true
            autofocus: true

          - type: rss
            title: Devon News
            style: horizontal-cards
            limit: 10
            collapse-after: 6
            feeds:
              - url: https://feeds.bbci.co.uk/news/england/devon/rss.xml
                title: BBC Devon

              - url: https://www.devonlive.com/news/?service=rss
                title: Devon Live

      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Development
                color: 210 60 55
                links:
                  - title: My repos
                    url: https://github.com/fluxtt?tab=repositories
                    icon: si:github

                  - title: regex101
                    url: https://regex101.com
                    icon: mdi:regex

              - title: Productivity
                color: 40 70 55
                links:
                  - title: Todoist
                    url: https://todoist.com
                    icon: si:todoist

                  - title: Claude
                    url: https://claude.ai
                    icon: si:claude

              - title: Homelab
                color: 150 40 55
                links:
                  - title: UniFi Network
                    url: https://unifi.ui.com/consoles/6f3f01b4-352b-46c5-93dd-c53ad4ac2e14/network/default/dashboard
                    icon: si:ubiquiti

          - type: monitor
            title: Services
            cache: 2m
            sites:
              - title: AdGuard Home
                url: http://192.168.1.100/
                icon: si:adguard
